            font-size: 13px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s, transform 0.1s;

        .btn-openvpn {

            color: #61afef;
            border: 1px solid #3b506b;

        .btn-openvpn:hover {

        .no-link {

</head>
