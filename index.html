<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اشتراک‌های OpenVPN و Surfshark</title>
  <style>
    :root { --card:rgba(15,23,42,.65); --text:#f8fafc; --muted:#94a3b8; --border:rgba(148,163,184,.28); --orange:#f97316; --blue:#38bdf8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:20px; color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(135deg,#0f172a,#1e1b4b,#090d16); background-size:400% 400%; animation:background 15s ease infinite; }
    @keyframes background { 0%,100%{background-position:0 50%} 50%{background-position:100% 50%} }
    .container { max-width:1000px; margin:auto; padding:30px; background:rgba(30,41,59,.76); border:1px solid var(--border); border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,.35); backdrop-filter:blur(16px); }
    h1 { margin:0 0 8px; text-align:center; font-size:1.75rem; }
    .subtitle { margin:0 0 24px; text-align:center; color:var(--muted); }
    .search { width:100%; padding:12px 16px; margin-bottom:20px; color:var(--text); background:rgba(15,23,42,.8); border:1px solid var(--border); border-radius:10px; font:inherit; outline:none; }
    .search:focus { border-color:var(--orange); box-shadow:0 0 12px rgba(249,115,22,.25); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; max-height:620px; padding:4px; overflow-y:auto; }
    .card { padding:14px 16px; border:1px solid var(--border); border-radius:10px; background:var(--card); transition:.2s; }
    .card:hover { transform:translateY(-2px); border-color:var(--orange); box-shadow:0 4px 15px rgba(249,115,22,.18); }
    .heading { display:flex; gap:10px; align-items:center; margin-bottom:12px; direction:ltr; }
    .flag { font-size:1.35rem; } .name { font-weight:600; font-size:.95rem; }
    .actions { display:flex; flex-wrap:wrap; gap:6px; direction:ltr; }
    .btn { padding:6px 9px; cursor:pointer; border:1px solid var(--border); border-radius:6px; color:var(--muted); background:transparent; font:inherit; font-size:.78rem; transition:.2s; }
    .btn:hover { color:var(--orange); border-color:var(--orange); background:rgba(249,115,22,.12); }
    .btn.surf:hover { color:var(--blue); border-color:var(--blue); background:rgba(56,189,248,.12); }
    .modal { display:none; position:fixed; inset:0; z-index:10; align-items:center; justify-content:center; background:rgba(0,0,0,.72); backdrop-filter:blur(6px); }
    .modal-content { position:relative; width:min(320px,90vw); padding:24px; text-align:center; background:#1e293b; border:1px solid var(--orange); border-radius:14px; }
    .close { position:absolute; top:8px; left:14px; border:0; color:var(--muted); background:transparent; font-size:1.5rem; cursor:pointer; }
    #qrImage { display:block; width:220px; max-width:100%; margin:16px auto; padding:8px; background:#fff; border-radius:8px; }
    #qrText { direction:ltr; word-break:break-all; color:var(--muted); font-size:.78rem; }
    #toast { visibility:hidden; position:fixed; z-index:20; bottom:32px; left:50%; transform:translateX(-50%); padding:12px 24px; border:1px solid var(--orange); border-radius:10px; color:var(--text); background:#0f172a; opacity:0; transition:.25s; }
    #toast.show { visibility:visible; opacity:1; bottom:50px; }
    footer { margin-top:20px; text-align:center; color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
  <main class="container">
    <h1>سرویس‌های اتصال</h1>
    <p class="subtitle">فایل‌های OpenVPN و Surfshark بر اساس کشور</p>
    <input id="search" class="search" type="search" placeholder="جستجوی کشور..." autocomplete="off">
    <section id="countryGrid" class="grid" aria-live="polite"></section>
  </main>
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content"><button class="close" aria-label="بستن">×</button><h3 id="qrTitle">QR کد</h3><img id="qrImage" alt="QR Code"><p id="qrText"></p></div>
  </div>
  <div id="toast">لینک کپی شد.</div>
  <footer>به یاد تمامی جاویدنامان ایران</footer>
  <script>
    const repoBase = 'https://cdn.jsdelivr.net/gh/JavidnamanIran-at-Telegram/sing-box_sub@main/';
    const countries = [
      ['Albania','AL','🇦🇱'],['Algeria','DZ','🇩🇿'],['Andorra','AD','🇦🇩'],['Argentina','AR','🇦🇷'],['Armenia','AM','🇦🇲'],['Australia','AU','🇦🇺'],['Austria','AT','🇦🇹'],['Bahamas','BS','🇧🇸'],['Bangladesh','BD','🇧🇩'],['Belarus','BY','🇧🇾'],['Belgium','BE','🇧🇪'],['Bolivia','BO','🇧🇴'],['Bosnia','BA','🇧🇦'],['Brazil','BR','🇧🇷'],['Bulgaria','BG','🇧🇬'],['Cambodia','KH','🇰🇭'],['Canada','CA','🇨🇦'],['Chile','CL','🇨🇱'],['China','CN','🇨🇳'],['Colombia','CO','🇨🇴'],['Costa_Rica','CR','🇨🇷'],['Croatia','HR','🇭🇷'],['Cyprus','CY','🇨🇾'],['Czech','CZ','🇨🇿'],['Denmark','DK','🇩🇰'],['Dominican_Republic','DO','🇩🇴'],['Ecuador','EC','🇪🇨'],['Egypt','EG','🇪🇬'],['Estonia','EE','🇪🇪'],['Finland','FI','🇫🇮'],['France','FR','🇫🇷'],['Georgia','GE','🇬🇪'],['Germany','DE','🇩🇪'],['Greece','GR','🇬🇷'],['Greenland','GL','🇬🇱'],['Guatemala','GT','🇬🇹'],['Hong_Kong_Sar_China','HK','🇭🇰'],['Hungary','HU','🇭🇺'],['Iceland','IS','🇮🇸'],['India','IN','🇮🇳'],['Indonesia','ID','🇮🇩'],['Iran','IR','🇮🇷'],['Ireland','IE','🇮🇪'],['Isleofman','IM','🇮🇲'],['Israel','IL','🇮🇱'],['Italy','IT','🇮🇹'],['Japan','JP','🇯🇵'],['Kazakhstan','KZ','🇰🇿'],['Kenya','KE','🇰🇪'],['Laos','LA','🇱🇦'],['Latvia','LV','🇱🇻'],['Liechtenstein','LI','🇱🇮'],['Lithuania','LT','🇱🇹'],['Luxembourg','LU','🇱🇺'],['Macau_Sar_China','MO','🇲🇴'],['Macedonia','MK','🇲🇰'],['Malaysia','MY','🇲🇾'],['Malta','MT','🇲🇹'],['Mexico','MX','🇲🇽'],['Moldova','MD','🇲🇩'],['Monaco','MC','🇲🇨'],['Mongolia','MN','🇲🇳'],['Montenegro','ME','🇲🇪'],['Morocco','MA','🇲🇦'],['Myanmar_Burma_','MM','🇲🇲'],['Nepal','NP','🇳🇵'],['Netherlands','NL','🇳🇱'],['New_Zealand','NZ','🇳🇿'],['Nigeria','NG','🇳🇬'],['Norway','NO','🇳🇴'],['Pakistan','PK','🇵🇰'],['Panama','PA','🇵🇦'],['Peru','PE','🇵🇪'],['Poland','PL','🇵🇱'],['Portugal','PT','🇵🇹'],['Qatar','QA','🇶🇦'],['Romania','RO','🇷🇴'],['Russia','RU','🇷🇺'],['Saudi','SA','🇸🇦'],['Serbia','RS','🇷🇸'],['Singapore','SG','🇸🇬'],['Slovakia','SK','🇸🇰'],['Slovenia','SI','🇸🇮'],['South_Africa','ZA','🇿🇦'],['South_Korea','KR','🇰🇷'],['Spain','ES','🇪🇸'],['Srilanka','LK','🇱🇰'],['Sweden','SE','🇸🇪'],['Switzerland','CH','🇨🇭'],['Taiwan','TW','🇹🇼'],['Thailand','TH','🇹🇭'],['Turkey','TR','🇹🇷'],['Uae','AE','🇦🇪'],['Uk','GB','🇬🇧'],['Ukraine','UA','🇺🇦'],['United_States','US','🇺🇸'],['Uruguay','UY','🇺🇾'],['Venezuela','VE','🇻🇪'],['Vietnam','VN','🇻🇳']
    ];
    // Exact filenames visible in the Surfshark screenshots.
    const surfsharkFiles = {
      Albania:'Albaniassh.txt', Argentina:'Argentinassh.txt', Armenia:'Armeniassh.txt', Australia:'Australiassh.txt', Austria:'Austriassh.txt', Belgium:'Belgiummssh.txt', Brazil:'Brazilssh.txt', Bulgaria:'Bulgariassh.txt', Canada:'Canadassh.txt', Chile:'Chilessh.txt', Colombia:'Colombiassh.txt', Costa_Rica:'Costa_Ricassh.txt', Croatia:'Croatiassh.txt', Cyprus:'Cyprusssh.txt', Czech:'Czechiassh.txt', Denmark:'Denmarkssh.txt', Ecuador:'Ecuadorssh.txt', Estonia:'Estoniassh.txt', Finland:'Finlandssh.txt', France:'Francessh.txt', Georgia:'Georgiassh.txt', Germany:'Germanyssh.txt', Greece:'Greecessh.txt', Hong_Kong_Sar_China:'Hong_Kongssh.txt', Hungary:'Hungaryssh.txt', Iceland:'Icelandssh.txt', India:'Indiassh.txt', Indonesia:'Indonesiassh.txt', Ireland:'Irelandssh.txt', Israel:'Israelssh.txt', Italy:'Italyssh.txt', Japan:'Japanssh.txt', Kazakhstan:'Kazakhstanssh.txt', Latvia:'Latviassh.txt', Lithuania:'Lithuaniassh.txt', Luxembourg:'Luxembourgssh.txt', Malaysia:'Malaysiassh.txt', Mexico:'Mexicoss h.txt'.replace(' ',''), Moldova:'Moldovassh.txt', Netherlands:'Netherlandsssh.txt', New_Zealand:'New_Zealandssh.txt', Norway:'Norwayssh.txt', Panama:'Panamassh.txt', Peru:'Perussh.txt', Poland:'Polandssh.txt', Portugal:'Portugalssh.txt', Romania:'Romaniassh.txt', Serbia:'Serbiassh.txt', Singapore:'Singaporessh.txt', Slovakia:'Slovakiassh.txt', Slovenia:'Sloveniassh.txt', South_Africa:'South_Africassh.txt', South_Korea:'South_Koreassh.txt', Spain:'Spainssh.txt', Sweden:'Swedenssh.txt', Switzerland:'Switzerlandssh.txt', Taiwan:'Taiwanssh.txt', Thailand:'Thailandssh.txt', Turkey:'Turkeyssh.txt', Ukraine:'Ukrainessh.txt', Uk:'United_Kingdomssh.txt', United_States:'United_Statesssh.txt', Uruguay:'Uruguayssh.txt', Venezuela:'Venezuelassh.txt', Vietnam:'Vietnamssh.txt'
    };
    const grid = document.getElementById('countryGrid');
    const escapeHtml = value => value.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const urlFor = file => repoBase + encodeURIComponent(file).replace(/%2F/g, '/');
    const button = (label, file, type) => `<button class="btn ${type}" data-file="${escapeHtml(file)}" data-type="${type}" data-action="copy">${label} · کپی</button><button class="btn ${type}" data-file="${escapeHtml(file)}" data-type="${type}" data-action="qr">${label} · QR</button>`;
    function render(filter = '') {
      const query = filter.trim().toLowerCase();
      grid.innerHTML = countries.filter(([name, code]) => `${name} ${code}`.toLowerCase().includes(query)).map(([name, code, flag]) => {
        const openvpn = `${name}.txt`;
        const surfshark = surfsharkFiles[name];
        return `<article class="card"><div class="heading"><span class="flag">${flag}</span><span class="name">${name.replace(/_/g, ' ')}</span></div><div class="actions">${button('OpenVPN', openvpn, 'openvpn')}${surfshark ? button('Surfshark', surfshark, 'surf') : ''}</div></article>`;
      }).join('');
    }
    function showToast() { const toast = document.getElementById('toast'); toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); }
    async function copy(file) { await navigator.clipboard.writeText(urlFor(file)); showToast(); }
    function showQr(file, type) { const url = urlFor(file); const importUrl = `sing-box://import-remote-profile?url=${encodeURIComponent(url)}#${encodeURIComponent(type === 'surf' ? 'Surfshark' : 'OpenVPN')}`; document.getElementById('qrTitle').textContent = `QR کد ${type === 'surf' ? 'Surfshark' : 'OpenVPN'}`; document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(importUrl)}`; document.getElementById('qrText').textContent = importUrl; document.getElementById('modal').style.display = 'flex'; }
    grid.addEventListener('click', event => { const target = event.target.closest('button[data-action]'); if (!target) return; const {file, type, action} = target.dataset; if (action === 'copy') copy(file).catch(() => alert('کپی ناموفق بود.')); else showQr(file, type); });
    document.getElementById('search').addEventListener('input', event => render(event.target.value));
    document.querySelector('.close').addEventListener('click', () => document.getElementById('modal').style.display = 'none');
    document.getElementById('modal').addEventListener('click', event => { if (event.target.id === 'modal') event.currentTarget.style.display = 'none'; });
    render();
  </script>
</body>
</html>
