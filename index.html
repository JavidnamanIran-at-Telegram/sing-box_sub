<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sing-Box Subscriptions - ساب لینکهای سینگ باکس</title>
    <style>
        :root {
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #f97316; /* نارنجی */
            --accent-hover: #ea580c; /* نارنجی پررنگ‌تر */
            --border-color: rgba(51, 65, 85, 0.6);
        }

        /* Animated Dancing Background */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #090d16);
            background-size: 400% 400%;
            animation: gradientDance 15s ease infinite;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        @keyframes gradientDance {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
            color: var(--text-color);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding: 4px;
        }

        .grid::-webkit-scrollbar {
            width: 6px;
        }

        .grid::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 3px;
        }

        .grid::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .card {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            border-color: var(--accent-color);
            background-color: rgba(30, 41, 59, 0.9);
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.2);
            transform: translateY(-2px);
        }

        .country-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flag {
            font-size: 1.3rem;
            line-height: 1;
        }

        .card span.name {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: rgba(249, 115, 22, 0.15);
        }

        /* Modal styling for QR Code */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--accent-color);
            padding: 24px;
            border-radius: 14px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            position: relative;
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.3);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--accent-color);
        }

        .modal-content img {
            margin: 15px 0;
            background: white;
            padding: 10px;
            border-radius: 8px;
            max-width: 200px;
            height: auto;
        }

        .modal-content p {
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-all;
            margin: 0;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>

    <!-- QR Code Modal Box -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 style="margin:0 0 10px 0; font-size:1.1rem; color: var(--accent-color);">اسکن QR کد</h3>
            <img id="qrImage" src="" alt="QR Code">
            <p id="modalLinkText"></p>
        </div>
    </div>

    <footer>

    <script>
        // Filter countries based on search input
        function filterCountries() {
            let input = document.getElementById('search');
            let filter = input.value.toLowerCase();
            let grid = document.getElementById('countryGrid');
            let cards = grid.getElementsByClassName('card');

            for (let i = 0; i < cards.length; i++) {
                let nameSpan = cards[i].getElementsByClassName('name')[0];
                let txtValue = nameSpan.textContent || nameSpan.innerText;
                if (txtValue.toLowerCase().indexOf(filter) > -1) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // Copy full absolute URL of the config file to clipboard
        function copyFileLink(fileName) {
            const fullUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/') + fileName;
            navigator.clipboard.writeText(fullUrl).then(() => {
                alert("لینک کپی شد: " + fullUrl);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // Show QR Code modal for specific file
        function showQRCode(fileName) {
            const fullUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/') + fileName;
            const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(fullUrl)}`;
            
            document.getElementById('qrImage').src = qrApi;
            document.getElementById('modalLinkText').innerText = fullUrl;
            document.getElementById('qrModal').style.display = 'flex';
        }

        // Close the modal popup
        function closeModal() {
            document.getElementById('qrModal').style.display = 'none';
        }

        // Close modal when clicking outside of content box
        window.onclick = function(event) {
            const modal = document.getElementById('qrModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
